[project]
name = "alavavision"
version = "0.1.0"
description = "Sistema de TV Corporativa / Digital Signage"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0",
    "Pydantic>=2.0",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alavavision*"]