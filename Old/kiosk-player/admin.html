<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosk • Painel ADM</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --txt:#e8eaf0; --mut:#8b93a5; --acc:#4f8cff; --ok:#2ecc71; --bad:#ff5c5c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--txt); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--mut); margin-bottom: 22px; font-size: 14px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 14px; }
  .row { display:grid; grid-template-columns: 28px 1fr 110px 70px 120px; gap:10px; align-items:center; padding:10px 6px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .head { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  input[type=text], input[type=number] { width:100%; background:#0f1115; border:1px solid var(--line); color:var(--txt); padding:9px 10px; border-radius:8px; font-size:14px; }
  input:focus { outline:2px solid var(--acc); border-color:transparent; }
  button { background:#232834; color:var(--txt); border:1px solid var(--line); padding:8px 10px; border-radius:8px; cursor:pointer; font-size:14px; }
  button:hover { border-color: var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; padding:10px 18px; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  .actions { display:flex; gap:6px; justify-content:flex-end; }
  .bar { display:flex; gap:10px; margin-top:16px; align-items:center; }
  .status { color:var(--mut); font-size:14px; }
  .status.ok { color:var(--ok); } .status.err { color:var(--bad); }
  .empty { text-align:center; color:var(--mut); padding:30px; }
  .total { margin-left:auto; color:var(--mut); font-size:13px; }
  @media (max-width: 640px) { .row { grid-template-columns: 24px 1fr 80px; } .row .en, .row .actions { grid-column: 2 / 4; } .head { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>📺 Painel do Kiosk</h1>
  <div class="sub">Adicione as páginas, defina quanto tempo cada uma fica na tela e salve. O player aplica sozinho em alguns segundos.</div>

  <div class="card">
    <div class="row head"><div>#</div><div>Endereço (URL)</div><div>Tempo (seg)</div><div>Ativa</div><div></div></div>
    <div id="list"></div>
    <div class="bar">
      <button id="add">+ Adicionar página</button>
      <button class="primary" id="save">Salvar</button>
      <span id="status" class="status"></span>
      <span id="total" class="total"></span>
    </div>
  </div>
</div>

<script>
let pages = [];
const $ = (s) => document.querySelector(s);

function uid() { return Math.random().toString(36).slice(2, 10); }

function render() {
  const list = $("#list");
  list.innerHTML = "";
  if (!pages.length) {
    list.innerHTML = '<div class="empty">Nenhuma página ainda. Clique em “Adicionar página”.</div>';
  }
  pages.forEach((p, i) => {
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML = `
      <div>${i + 1}</div>
      <div><input type="text" placeholder="https://exemplo.com" value="${p.url.replace(/"/g, "&quot;")}"></div>
      <div><input type="number" min="3" value="${p.seconds}"></div>
      <div class="en"><input type="checkbox" ${p.enabled ? "checked" : ""}></div>
      <div class="actions">
        <button title="Subir">↑</button>
        <button title="Descer">↓</button>
        <button class="danger" title="Remover">✕</button>
      </div>`;
    const [url, secs] = r.querySelectorAll("input[type=text], input[type=number]");
    const chk = r.querySelector("input[type=checkbox]");
    const [up, down, del] = r.querySelectorAll("button");
    url.oninput = () => (p.url = url.value);
    secs.oninput = () => { p.seconds = parseInt(secs.value) || 30; updateTotal(); };
    chk.onchange = () => { p.enabled = chk.checked; updateTotal(); };
    up.onclick = () => { if (i > 0) { [pages[i-1], pages[i]] = [pages[i], pages[i-1]]; render(); } };
    down.onclick = () => { if (i < pages.length - 1) { [pages[i+1], pages[i]] = [pages[i], pages[i+1]]; render(); } };
    del.onclick = () => { pages.splice(i, 1); render(); };
    list.appendChild(r);
  });
  updateTotal();
}

function updateTotal() {
  const t = pages.filter(p => p.enabled).reduce((a, p) => a + (p.seconds || 0), 0);
  $("#total").textContent = pages.length ? `Ciclo completo: ${Math.floor(t/60)}min ${t%60}s` : "";
}

function setStatus(msg, cls = "") { const s = $("#status"); s.textContent = msg; s.className = "status " + cls; }

async function load() {
  try {
    const r = await fetch("/api/pages");
    pages = (await r.json()).pages || [];
    render();
  } catch (e) { setStatus("Erro ao carregar: " + e.message, "err"); }
}

$("#add").onclick = () => { pages.push({ id: uid(), url: "", seconds: 30, enabled: true }); render(); };

$("#save").onclick = async () => {
  setStatus("Salvando…");
  try {
    const r = await fetch("/api/pages", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pages }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    pages = (await r.json()).pages;
    render();
    setStatus("Salvo ✔ — o player atualiza em instantes", "ok");
  } catch (e) { setStatus("Erro ao salvar: " + e.message, "err"); }
};

load();
</script>
</body>
</html>
